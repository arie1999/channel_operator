[project]
name = "channels-operator"
version = "0.1.0"
description = "Automated content curation platform with operator approval via Telegram"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",                      # OpenRouter is OpenAI-compatible
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-telegram-bot[ext]>=21.0",
  "apscheduler>=3.10",
  "feedparser>=6.0",
  "arxiv>=2.1",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
channels-operator = "channels_operator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channels_operator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
